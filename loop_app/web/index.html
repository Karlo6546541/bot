<!DOCTYPE html>
<html lang="hr">
<head>

    href value below to reflect the base path you are serving from.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="description" content="Subhasto — oglasnik za kolekcionare.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Subhasto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Subhasto — oglasnik za kolekcionare</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#171C1D">
  <style>
    :root { color-scheme: dark; --page: #171C1D; --surface: #1F2627; --line: #343D3F; --ink: #F2F4F4; --muted: #A4ADAF; --teal: #449DA8; --teal2: #6CC3CD; --gold: #E0B04A; }
    html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    #pre-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(120% 70% at 50% 42%, #22302F 0%, #171C1D 60%); transition: opacity .4s ease, transform .4s ease; }
    #pre-splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
    /* Riječ: svako slovo prvo je kolekcionarski predmet koji padne i okrene se u slovo */
    .word { position: relative; display: flex; align-items: baseline; font-size: 48px; font-weight: 800; letter-spacing: -.035em; line-height: 1; height: 64px; padding-top: 6px; }
    .t { position: relative; display: inline-block; perspective: 400px; }
    .t b { display: inline-block; opacity: 0; transform: rotateY(-90deg); animation: letter .18s calc(.42s + var(--i) * 60ms) ease-out forwards, wave 2.4s calc(1.9s + var(--i) * 70ms) ease-in-out infinite; }
    .f { position: absolute; left: 50%; top: 50%; width: 34px; height: 46px; margin: -26px 0 0 -17px; box-sizing: border-box; opacity: 0; transform: translateY(-46px) scale(.5) rotate(-14deg); animation: drop .3s calc(var(--i) * 60ms) cubic-bezier(.2,.9,.3,1.35) forwards, flip .16s calc(.26s + var(--i) * 60ms) ease-in forwards; }
    @keyframes drop { to { opacity: 1; transform: none; } }
    @keyframes flip { from { opacity: 1; transform: rotateY(0); } to { opacity: 0; transform: rotateY(90deg) scale(.9); } }
    @keyframes letter { to { opacity: 1; transform: none; } }
    @keyframes wave { 0%, 12%, 100% { transform: none; color: var(--ink); } 6% { transform: translateY(-5px); color: var(--teal2); } }
    /* Predmeti */
    .card { border-radius: 6px; background: linear-gradient(155deg, #4FB0BB, #1D4D53); border: 1px solid rgba(255,255,255,.3); box-shadow: inset 0 0 0 3px rgba(255,255,255,.12); }
    .card::after { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; color: #fff; }
    .coin { width: 38px; height: 38px; margin: -22px 0 0 -19px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7A3, #E0B04A 50%, #9A6A1C); box-shadow: inset 0 0 0 3px rgba(122,82,20,.5); }
    .coin::after { content: "1"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 800; color: #7A5214; }
    .stamp { padding: 4px; background: #F3EEDD; -webkit-mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle 2.5px at 4px 4px, transparent 96%, #000) -4px -4px / 8px 8px; mask: linear-gradient(#000 0 0) content-box, radial-gradient(circle 2.5px at 4px 4px, transparent 96%, #000) -4px -4px / 8px 8px; }
    .stamp::after { content: ""; position: absolute; inset: 4px; background: linear-gradient(180deg, #8ED0D6 55%, #2B6F78 55%); }
    .vinyl { width: 40px; height: 40px; margin: -22px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, var(--teal2) 0 5px, #111 6px, #222 9px, #111 10px, #222 13px, #111 14px, #1c1c1c 100%); }
    .watch { width: 30px; height: 46px; margin-left: -15px; background: linear-gradient(90deg, transparent 8px, #5A4632 8px 22px, transparent 22px); }
    .watch::after { content: ""; position: absolute; left: 1px; top: 9px; width: 24px; height: 24px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 25%, transparent 0) , #F2F4F4; border: 2px solid var(--gold); box-shadow: inset 11px -1px 0 -10px #171C1D, inset 0 -8px 0 -7px #171C1D; }
    .note { width: 44px; height: 26px; margin: -16px 0 0 -22px; border-radius: 3px; background: linear-gradient(90deg, #6FAF7E, #3E7D50); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
    .note::after { content: "€"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; color: rgba(255,255,255,.85); }
    .medal { width: 30px; margin-left: -15px; background: linear-gradient(90deg, #C0392B 50%, #2E5FA8 50%) top / 18px 18px no-repeat; }
    .medal::after { content: ""; position: absolute; left: 3px; bottom: 2px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7A3, #E0B04A 55%, #9A6A1C); }
    .cart { width: 38px; height: 40px; margin: -22px 0 0 -19px; border-radius: 4px 4px 2px 2px; background: #9AA3A5; box-shadow: inset 0 -6px 0 #6E7779; }
    .cart::after { content: ""; position: absolute; left: 6px; right: 6px; top: 6px; height: 16px; border-radius: 2px; background: linear-gradient(135deg, var(--teal2), #2B6F78); }
    /* Točka na kraju: udar čekića */
    .dot { position: relative; display: inline-block; width: 11px; height: 11px; margin-left: 3px; border-radius: 50%; background: var(--teal2); opacity: 0; transform: translateY(-40px) scale(2); animation: slam .26s .98s cubic-bezier(.6,0,.8,1.3) forwards; }
    .dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -6px; border-radius: 50%; border: 2px solid var(--teal2); opacity: 0; animation: ring .5s 1.2s ease-out forwards; }
    @keyframes slam { 70% { opacity: 1; transform: translateY(0) scale(1.2, .7); } 100% { opacity: 1; transform: none; } }
    @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }
    .tag { margin-top: 10px; font-size: 14px; color: var(--muted); opacity: 0; transform: translateY(6px); animation: up .4s 1.15s ease forwards; }
    @keyframes up { to { opacity: 1; transform: none; } }
    .bar { margin-top: 22px; width: 132px; height: 3px; border-radius: 3px; background: #2A3335; overflow: hidden; opacity: 0; animation: up .3s 1.25s forwards; }
    .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, var(--teal), var(--teal2)); border-radius: 3px; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @media (max-width: 340px) { .word { font-size: 40px; } }
    @media (prefers-reduced-motion: reduce) {
      #pre-splash *, #pre-splash *::before, #pre-splash *::after { animation: none !important; }
      .f { display: none; } .t b, .dot, .tag, .bar { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="pre-splash" role="status" aria-label="Subhasto se učitava">
    <div class="word" aria-hidden="true"><span class="t" style="--i:0"><i class="f card"></i><b>S</b></span><span class="t" style="--i:1"><i class="f coin"></i><b>u</b></span><span class="t" style="--i:2"><i class="f stamp"></i><b>b</b></span><span class="t" style="--i:3"><i class="f vinyl"></i><b>h</b></span><span class="t" style="--i:4"><i class="f watch"></i><b>a</b></span><span class="t" style="--i:5"><i class="f note"></i><b>s</b></span><span class="t" style="--i:6"><i class="f medal"></i><b>t</b></span><span class="t" style="--i:7"><i class="f cart"></i><b>o</b></span><span class="dot"></span></div>
    <div class="tag">Oglasnik za kolekcionare</div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <script>
    (function () {
      var start = Date.now(), done = false;
      function hide() {
        if (done) return; done = true;
        // Riječ se uvijek stigne ispisati (~1,3 s), zatim se ekran ugasi.
        var wait = Math.max(0, 1500 - (Date.now() - start));
        setTimeout(function () {
          var s = document.getElementById('pre-splash');
          if (!s) return;
          s.classList.add('out');
          setTimeout(function () { s.remove(); }, 450);
        }, wait);
      }
      // Aplikacija javi kad je stvarno spremna (lib/services/boot_signal).
      window.subhastoReady = hide;
      // Sigurnosna mreža ako se signal nikad ne pošalje.
      setTimeout(hide, 20000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Uvijek najnovija verzija: stari service workeri se brišu, a
    // flutter_bootstrap.js (koji nosi oznaku verzije) se ne uzima iz cachea.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
    var s = document.createElement('script');
    s.src = 'flutter_bootstrap.js?t=' + Date.now();
    s.async = true;
    document.body.appendChild(s);
  </script>
</body>
</html>
