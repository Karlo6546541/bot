# Merge these function settings into your Supabase CLI project's config.toml.
[functions.live-token]
verify_jwt = false
[functions.stripe-connect]
verify_jwt = false
[functions.stripe-checkout]
verify_jwt = false
[functions.stripe-webhook]
verify_jwt = false
# User-facing functions verify Supabase user JWT with auth.getUser themselves.
# stripe-webhook verifies Stripe's raw-body signature; it has no user JWT.

[functions.live-control]
verify_jwt = false
