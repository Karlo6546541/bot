# Gradi oglasnik (oglasnik/) i spremljene Flutter verzije te ih objavljuje na
# GitHub Pages: https://<korisnik>.github.io/bot/ (oglasnik),
# https://<korisnik>.github.io/bot/v0-aukcije/ (aukcije, arhiva)
#
# Jednokratno postavljanje (Settings repozitorija):
#   1. Pages → Build and deployment → Source: "GitHub Actions".
#   2. (Neobavezno, za online bazu) Secrets and variables → Actions →
#      New repository secret: SUPABASE_URL i SUPABASE_KEY.
#      Bez njih web verzija radi lokalno (podaci samo u pregledniku).
name: LOOP web (GitHub Pages)

on:
  push:
    branches: [main, claude/beautiful-newton-sftcyd]
    paths: ["loop_app/**", "oglasnik/**", "site/**", ".github/workflows/loop-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: loop-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loop_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --dart-define=LIVE_ENABLED=true --dart-define=BUY_NOW_ENABLED=true

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Neobavezno: TURN poslužitelj za video u live aukcijama.
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          # Neobavezno: BOX NOW partner ID za kartu paketomata.
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: >
          flutter build web --release --base-href /bot/v0-aukcije/ --no-web-resources-cdn
          --dart-define=CLOUD_COMMERCE_ENABLED="${{ vars.CLOUD_COMMERCE_ENABLED || 'true' }}"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
          --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL"
          --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER"
          --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS"
          --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"

      # Preview the simplified Flutter UI beside the unchanged main app.
      - name: Build simplified design (/bot/novi-izgled/)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: |
          flutter build web --release --output build/simple-web --base-href /bot/novi-izgled/ --no-web-resources-cdn \
            --dart-define=SIMPLE_DESIGN=true \
            --dart-define=CLOUD_COMMERCE_ENABLED="${{ vars.CLOUD_COMMERCE_ENABLED || 'true' }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL" --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER" \
            --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS" --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"
          cp -r build/simple-web build/web/novi-izgled

      # Spremljena kopija prije prodavatelja-trgovaca (samo privatne osobe):
      # https://<korisnik>.github.io/bot/privatni/
      - uses: actions/checkout@v4
        with:
          ref: 4fd1b565982deb864e15e80349f7a432ef41c8d6
          path: privatni

      - name: Build saved copy (/bot/privatni/)
        working-directory: privatni/loop_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: |
          flutter pub get
          flutter build web --release --base-href /bot/privatni/ --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL" \
            --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER" \
            --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS" \
            --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"
          cp -r build/web "$GITHUB_WORKSPACE/loop_app/build/web/privatni"

      # Spremljena kopija prije velikog pojednostavljenja (sve funkcije:
      # priče, liste želja, zamjene, digitalno…): .../bot/puna/
      - uses: actions/checkout@v4
        with:
          ref: 556ea6b131a6dabde706694f3ad06bfca5c6999a
          path: puna

      - name: Build saved copy (/bot/puna/)
        working-directory: puna/loop_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: |
          flutter pub get
          flutter build web --release --base-href /bot/puna/ --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL" \
            --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER" \
            --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS" \
            --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"
          cp -r build/web "$GITHUB_WORKSPACE/loop_app/build/web/puna"

      # Exact source snapshot saved before the November 4 redesign.
      - uses: actions/checkout@v4
        with:
          ref: 0a41ca6fac5a626de6eb6c0ee0956f4a28989435
          path: prije-redizajna-2026-11-04

      - name: Build saved copy (/bot/prije-redizajna-2026-11-04/)
        working-directory: prije-redizajna-2026-11-04/loop_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --base-href /bot/prije-redizajna-2026-11-04/ --no-web-resources-cdn \
            --dart-define=CLOUD_COMMERCE_ENABLED="${{ vars.CLOUD_COMMERCE_ENABLED || 'true' }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL" \
            --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER" \
            --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS" \
            --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"
          cp -r build/web "$GITHUB_WORKSPACE/loop_app/build/web/prije-redizajna-2026-11-04"

      # Exact source snapshot saved before the supplied VisionOS redesign.
      - uses: actions/checkout@v4
        with:
          ref: dadec61d438ef29a0a1acdf5a0f2ed4619b1ffc7
          path: prije-visionos-2026-11-04

      - name: Build saved copy (/bot/prije-visionos-2026-11-04/)
        working-directory: prije-visionos-2026-11-04/loop_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --base-href /bot/prije-visionos-2026-11-04/ --no-web-resources-cdn \
            --dart-define=CLOUD_COMMERCE_ENABLED="${{ vars.CLOUD_COMMERCE_ENABLED || 'true' }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL" \
            --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER" \
            --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS" \
            --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"
          cp -r build/web "$GITHUB_WORKSPACE/loop_app/build/web/prije-visionos-2026-11-04"

      # Spremljena kopija aplikacije prije prelaska na samo aukcije (live,
      # Kupi odmah i trgovina uključeni; novi izgled): .../bot/prije-samo-aukcije/
      - uses: actions/checkout@v4
        with:
          ref: e9506eeaf666a7a48c5b54b4aa47d1dd39b09bdf
          path: prije-samo-aukcije

      - name: Build saved copy (/bot/prije-samo-aukcije/)
        working-directory: prije-samo-aukcije/loop_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: |
          flutter pub get
          flutter build web --release --base-href /bot/prije-samo-aukcije/ --no-web-resources-cdn \
            --dart-define=SIMPLE_DESIGN=true \
            --dart-define=CLOUD_COMMERCE_ENABLED="${{ vars.CLOUD_COMMERCE_ENABLED || 'true' }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL" \
            --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER" \
            --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS" \
            --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"
          cp -r build/web "$GITHUB_WORKSPACE/loop_app/build/web/prije-samo-aukcije"

      # Marketinška stranica s listom čekanja: https://<korisnik>.github.io/bot/site/
      - name: Copy landing page (/bot/site/)
        run: cp -r "$GITHUB_WORKSPACE/site" "$GITHUB_WORKSPACE/loop_app/build/web/site"

      # Oglasnik za kolekcionare na glavnoj adresi (/bot/). Dosadašnja
      # aplikacija s aukcijama ostaje na /bot/v0-aukcije/, a spremljene
      # kopije i landing stranica na svojim podmapama.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build oglasnik (/bot/)
        working-directory: oglasnik
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VITE_APP_NAME: ${{ vars.APP_NAME || 'Subhasto' }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          BASE_PATH: /bot/
        run: |
          npm ci
          npx tsc -p .
          npm test
          npm run build
      - name: Assemble site
        run: |
          stari="$RUNNER_TEMP/flutter-web"
          mv loop_app/build/web "$stari"
          mkdir -p public
          cp -r oglasnik/dist/. public/
          for d in novi-izgled privatni puna prije-redizajna-2026-11-04 prije-visionos-2026-11-04 prije-samo-aukcije site; do
            [ -d "$stari/$d" ] && mv "$stari/$d" "public/$d"
          done
          mv "$stari" public/v0-aukcije

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4