# Provjere Next.js oglasnika (web/): tipovi, testovi (uključujući SQL na pravom
# Postgresu), izgradnja i smoke test pravog HTML-a (SEO, lokacije, mobitel 375 px)
# uz lažni Supabase.
name: Web (Next.js) provjere

on:
  push:
    branches: [main, claude/beautiful-newton-sftcyd]
    paths: ["web/**", ".github/workflows/web-checks.yml"]
  pull_request:
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provjere:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Lažni Supabase (PGlite s našim migracijama)
        run: MOCK_PORT=54321 node smoke/mock-supabase.mjs &
      - run: npm run build
      - name: Pokreni aplikaciju
        run: npx next start -p 3100 &
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/ >/dev/null && break; sleep 2; done
          npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-snimke
          path: web/smoke/out
