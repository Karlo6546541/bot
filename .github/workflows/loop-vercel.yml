# Gradi web aplikaciju i objavljuje je na Vercel (glavni naslov na /).
#
# Jednokratno postavljanje (Settings repozitorija → Secrets and variables → Actions):
#   VERCEL_TOKEN        token s https://vercel.com/account/tokens
#   VERCEL_ORG_ID       team_pGtb1D774SqwHdGH1O7loOvu
#   VERCEL_PROJECT_ID   prj_ZJiC2Gkf82dE3JjJH2uW2TKplPJG
#   SUPABASE_URL, SUPABASE_KEY (isti kao za GitHub Pages)
# Bez VERCEL_TOKEN posao se preskače (GitHub Pages i dalje radi).
name: LOOP web (Vercel)

on:
  push:
    branches: [main, claude/beautiful-newton-sftcyd]
    paths: ["loop_app/**", ".github/workflows/loop-vercel.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loop-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: loop_app
    steps:
      - name: Preskoči bez Vercel tokena
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN nije postavljen — preskačem." && exit 0
        working-directory: .
      - uses: actions/checkout@v4
        if: ${{ env.VERCEL_TOKEN != '' }}
      - uses: subosito/flutter-action@v2
        if: ${{ env.VERCEL_TOKEN != '' }}
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Build web (base /)
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIVE_TURN_URL: ${{ secrets.LIVE_TURN_URL }}
          LIVE_TURN_USER: ${{ secrets.LIVE_TURN_USER }}
          LIVE_TURN_PASS: ${{ secrets.LIVE_TURN_PASS }}
          BOXNOW_PARTNER_ID: ${{ vars.BOXNOW_PARTNER_ID }}
        run: |
          flutter pub get
          flutter build web --release --base-href / --no-web-resources-cdn \
            --dart-define=CLOUD_COMMERCE_ENABLED="${{ vars.CLOUD_COMMERCE_ENABLED || 'true' }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY" \
            --dart-define=LIVE_TURN_URL="$LIVE_TURN_URL" \
            --dart-define=LIVE_TURN_USER="$LIVE_TURN_USER" \
            --dart-define=LIVE_TURN_PASS="$LIVE_TURN_PASS" \
            --dart-define=BOXNOW_PARTNER_ID="$BOXNOW_PARTNER_ID"
          cp vercel.json build/web/vercel.json
      - name: Deploy na Vercel (production)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@latest
          cd build/web
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel deploy --prebuilt=false --prod --yes --token "$VERCEL_TOKEN"
