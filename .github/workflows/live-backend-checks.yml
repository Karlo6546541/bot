name: Live backend database checks
on:
  push:
    paths: ['backend/live/**', '.github/workflows/live-backend-checks.yml']
  pull_request:
    paths: ['backend/live/**', '.github/workflows/live-backend-checks.yml']
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/live/package-lock.json
      - run: npm ci && npm test
        working-directory: backend/live
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check backend/live/functions/integration-health/index.ts backend/live/functions/live-control/index.ts backend/live/functions/live-token/index.ts backend/live/functions/stripe-connect/index.ts backend/live/functions/stripe-checkout/index.ts backend/live/functions/stripe-webhook/index.ts
