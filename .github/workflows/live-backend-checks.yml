name: Live backend database checks
on:
  push:
    paths: ['backend/live/**', '.github/workflows/live-backend-checks.yml']
  pull_request:
    paths: ['backend/live/**', '.github/workflows/live-backend-checks.yml']
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/live/package-lock.json
      - run: npm ci && npm test
        working-directory: backend/live
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check backend/live/functions/integration-health/index.ts backend/live/functions/live-control/index.ts backend/live/functions/live-token/index.ts backend/live/functions/stripe-connect/index.ts backend/live/functions/stripe-checkout/index.ts backend/live/functions/stripe-webhook/index.ts

      - run: deno check backend/live/functions/stripe-setup/index.ts backend/live/functions/stripe-charge/index.ts backend/live/functions/stripe-promotion/index.ts backend/live/functions/stripe-release/index.ts

      - run: deno test --allow-env backend/live/tests/stripe_failure_test.ts
      - run: deno test --allow-env backend/live/tests/stripe_charge_test.ts
      - run: deno test backend/live/tests/config_values_test.ts
      - run: deno check backend/live/functions/delivery-lockers-sync/index.ts
      - run: deno test backend/live/tests/locker_catalog_test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate delivery migration name
        run: |
          supabase --version
          supabase migration new --help
          mkdir -p /tmp/subhasto-migration
          supabase migration new subhasto_delivery_locations --workdir /tmp/subhasto-migration
